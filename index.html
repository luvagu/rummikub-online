<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,viewport-fit=cover"
		/>
		<meta name="theme-color" content="#1b5e20" />
		<!-- Both colour schemes are supported; src/utils/theme.js can pin one. The inline script (kept tiny, not a module) applies a stored
		     override before first paint so a pinned scheme does not flash the other one. The page top is the green felt in both
		     schemes, so a single theme-color fits both. -->
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				var t = localStorage.getItem('rmkTheme')
				if (t === 'light' || t === 'dark') document.querySelector('meta[name="color-scheme"]').content = t
			} catch (e) {}
		</script>
		<meta
			name="description"
			content="Play classic Rummikub online with friends or solo against bots. Host a game, share a room code, and play in English or Spanish."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Rummikub Online" />
		<meta
			property="og:description"
			content="Play classic Rummikub online with friends or solo against bots. Host a game, share a room code, and play in English or Spanish."
		/>
		<meta property="og:site_name" content="Rummikub Online" />
		<meta property="og:url" content="%VITE_SITE_URL%" />
		<meta property="og:image" content="%VITE_SITE_URL%og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The word RUMMIKUB spelled with Rummikub tiles on a green felt table" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="%VITE_SITE_URL%og.png" />
		<meta name="twitter:title" content="Rummikub Online" />
		<meta
			name="twitter:description"
			content="Play classic Rummikub online with friends or solo against bots. Host a game, share a room code, and play in English or Spanish."
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<title>Rummikub Online</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
