name: Deploy to GitHub Pages
on: { push: { branches: [main] } }
permissions: { contents: read, pages: write, id-token: write }
# One deployment at a time; a newer push waits instead of cancelling one that is already going out.
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  # Build and upload in one job, deploy in another (GitHub's own Pages layout). Deploying in the same job, right after the
  # upload, sometimes found "0 artifacts": the run's artifact list had not caught up with the finished upload yet.
  build:
    runs-on: ubuntu-latest
    outputs:
      # unique per attempt, so a full re-run never collides with an earlier attempt's artifact; a re-run of only the
      # deploy job reads this output from the build attempt that produced the artifact
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - id: name
        run: echo "artifact=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm } # one source of truth for the Node version (see .nvmrc)
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: ${{ steps.name.outputs.artifact }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
